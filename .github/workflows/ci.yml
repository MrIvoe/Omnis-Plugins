name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a stale run when new commits land on the same PR/branch, so
# pushes during review don't queue up redundant runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match Omnis's own CI (see that repo's ci.yml) — this
  # package is only ever built as Omnis's dependency, so drifting from
  # Omnis's Flutter version here would validate against a config nobody
  # actually builds with. Bump deliberately, alongside Omnis's own pin.
  FLUTTER_VERSION: "3.27.4"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
