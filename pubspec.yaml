name: omnis_plugins
description: >
  Bundled plugin implementations for Omnis — compiled directly into the
  app, with full platform access, as opposed to sample_logger/ (a
  dart_eval-sandboxed, runtime-downloadable plugin, and not a pub package
  itself). Depends only on omnis_plugin_api, never on the Omnis app
  itself, so there's no circular dependency between this repo and Omnis.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned to a tag, not a floating branch: a push to Omnis must not
  # silently change what this package builds against. Bump the ref
  # deliberately (its own reviewed commit) when picking up new contract
  # changes on purpose. Must match Omnis's own pubspec.yaml declaration
  # of this package (same url+path+ref) — that's what lets pub treat
  # both edges of the graph as one consistent source.
  omnis_plugin_api:
    git:
      url: https://github.com/MrIvoe/Omnis.git
      path: packages/omnis_plugin_api
      ref: plugin-api-v0.2.0
  http: ^1.2.0
  crypto: ^3.0.7
  flutter_web_auth_2: ^5.0.3
  youtube_player_iframe: ^5.2.2
  id3_codec: ^1.0.3
  permission_handler: ^11.3.1
  geolocator: 12.0.0
  audio_session: ^0.1.25
  set_ringtone: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
