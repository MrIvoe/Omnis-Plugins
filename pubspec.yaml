name: omnis_plugins
description: >
  Bundled plugin implementations for Omnis — compiled directly into the
  app, with full platform access, as opposed to sample_logger/ (a
  dart_eval-sandboxed, runtime-downloadable plugin, and not a pub package
  itself). Depends only on omnis_plugin_api, never on the Omnis app
  itself, so there's no circular dependency between this repo and Omnis.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned to a tag, not a floating branch: a push to Omnis must not
  # silently change what this package builds against. Bump the ref
  # deliberately (its own reviewed commit) when picking up new contract
  # changes on purpose. Must match Omnis's own pubspec.yaml declaration
  # of this package (same url+path+ref) — that's what lets pub treat
  # both edges of the graph as one consistent source.
  omnis_plugin_api:
    git:
      url: https://github.com/MrIvoe/Omnis.git
      path: packages/omnis_plugin_api
      ref: plugin-api-v0.30.0
  http: ^1.2.0
  crypto: ^3.0.7
  flutter_web_auth_2: ^5.0.3
  youtube_player_iframe: ^5.2.2
  id3_codec: ^1.0.3
  permission_handler: ^11.3.1
  geolocator: 12.0.0
  audio_session: ^0.1.25
  set_ringtone: ^1.0.0
  path_provider: ^2.1.0
  # --- HomeDashboardPlugin's own duplicate of the Omnis app's
  #     TrackArtwork widget (see track_artwork.dart's own doc comment for
  #     why this is a duplicate, not a move) needs the same MediaStore
  #     artwork lookup on Android the app's original uses. Pinned to the
  #     same version Omnis's own pubspec.yaml declares. ---
  on_audio_query: ^2.9.0
  # --- Real spectrum visualizer (VisualizerPlugin). Android/iOS only —
  #     see that plugin's own doc comment for the RECORD_AUDIO permission
  #     requirement and the audioSessionId/session-targeting tradeoff.
  #     Pinned below ^1.1.0: that release bumped its SDK constraint to
  #     ^3.12.0, newer than this project's Flutter 3.27.4/Dart 3.6.2. ---
  audify: ^1.0.0
  # Only used by VisualizerPlugin to read the real Android SDK level —
  # audify needs API 24+ natively, but the app itself still targets
  # minSdkVersion 21 (see android/app/src/main/AndroidManifest.xml's
  # tools:overrideLibrary comment), so the plugin has to check this
  # itself and degrade gracefully below API 24 rather than assume.
  device_info_plus: ^10.0.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Used by test/online_page_test.dart to fake PluginStorage's secure tier
  # via flutter_secure_storage's own bundled
  # TestFlutterSecureStoragePlatform — same "declared directly since it's
  # imported directly" reasoning Omnis's own pubspec.yaml uses for this
  # identical pair. Already a transitive dependency via omnis_plugin_api.
  flutter_secure_storage: ^9.2.2
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
